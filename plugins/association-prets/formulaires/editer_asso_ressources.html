<div class="formulaire_spip formulaire_asso">
[<span class='erreur'>(#ENV*{message_erreur})</span>]
<form method="post" action="#ENV{action}"><div>
	#ACTION_FORMULAIRE{#ENV{action}}
	<fieldset>
		<legend>[(#ENV{title})]</legend>
		<div class="editer editer_code">
			<label for="code"><strong><:association_prets:ressources_libelle_code:></strong></label>
			<input type="text" name="code" [value="(#ENV{code})"] id="code"  class='formo'/>
		</div>

		<div class="editer editer_intitule">
			<label for="intitule"><strong><:association_prets:ressources_libelle_intitule:></strong></label>
			<input type="text" name="intitule" [value="(#ENV{intitule})"] id="intitule"  class='formo'/>
		</div>

		#SET{erreurs,#ENV**{erreurs}|table_valeur{date_acquisition}}
		<div class="editer editer_date_acquisition">
			[<span class='erreur_message'>(#GET{erreurs})</span>]
			<label for="date_acquisition"><strong><:association_prets:ressources_libelle_date_acquisition:></strong></label>
			<input type="text" name="date_acquisition" [value="(#ENV{date_acquisition}|affdate{d/m/Y})"] id="date_acquisition"  class='formo'/>
		</div>

		#SET{erreurs,#ENV**{erreurs}|table_valeur{pu}}
		<div class="editer editer_pu">
			[<span class='erreur_message'>(#GET{erreurs})</span>]
			<label for="pu"><strong><:association_prets:ressources_libelle_prix_location{devise=#ENV{devise}}:></strong></label>
			<input type="text" name="pu" [value="(#ENV{pu})"] id="pu"  class='formo'/>
		</div>

		<fieldset class="editer editer_statut">
			<legend><:association_prets:ressources_libelle_statut:></legend>
			<div class="choix">
				<input type='radio' class="radio" name='statut' value='ok' id='statut_ok'[ (#ENV{statut}|=={ok}|oui)checked="checked"] />
				<label for='statut_ok'><:association_prets:ressources_libelle_statut_ok:></label>
			</div>
			<div class="choix">
				<input type='radio' class="radio" name='statut' value='reserve' id='statut_reserve'[ (#ENV{statut}|=={reserve}|oui)checked="checked"] />
				<label for='statut_reserve'><:association_prets:ressources_libelle_statut_reserve:></label>
			</div>
			<div class="choix">
				<input type='radio' class="radio" name='statut' value='suspendu' id='statut_suspendu'[ (#ENV{statut}|=={suspendu}|oui)checked="checked"] />
				<label for='statut_suspendu'><:association_prets:ressources_libelle_statut_suspendu:></label>
			</div>
			<div class="choix">
				<input type='radio' class="radio" name='statut' value='sorti' id='statut_sorti'[ (#ENV{statut}|=={sorti}|oui)checked="checked"] />
				<label for='statut_sorti'><:association_prets:ressources_libelle_statut_sorti:></label>
			</div>
		</fieldset>

		<div class="editer editer_commentaire">
			<label for="commentaire"><strong><:association_prets:remarques:></strong></label>
			<input type="text" name="commentaire" [value="(#ENV{commentaire})"] id="commentaire"  class='formo'/>
		</div>

	</fieldset>

<p class="boutons"><input type="submit" value="<:pass_ok:>" class="submit" /></p>

</div>
</form>
</div>
