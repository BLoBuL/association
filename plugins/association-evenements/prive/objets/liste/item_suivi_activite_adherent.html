<BOUCLE_activites(ASSO_ACTIVITES){id_activite}{statut ?}>
    <tr class="#STATUT">
        <td class="id">
            <a class="bouton_editer" href="[(#URL_ECRIRE{editer_asso_activite,id_activite=#ID_ACTIVITE})]" title="<:association_evenements:activite_bouton_modifier_inscription:>">##ID_ACTIVITE</a>
        </td>
        <td class="date">[(#DATE|affdate{'d/m/y'})][<br><small>(#DATE|affdate{"H:i"})</small>]</td>
        <INCLURE{fond=prive/inclure/miniature_adherent,id_auteur,hauteur=40,largeur=40,date_adherent=oui,id_activite}/>
        <BOUCLE_evenement(EVENEMENTS){id_evenement}{tout}>
            <INCLURE{fond=prive/inclure/miniature_evenement,id_evenement,date_evenement=oui}/>
        </BOUCLE_evenement>
        <td><:association_evenements:evenement_supprime:></td>
        <//B_evenement>
<!--        
    <td class="statut">
            [(#STATUT|=={ok}|oui)<:association_evenements:activite_content_cotisation_ok:>]
            [(#STATUT|=={preinscrit}|oui)<:association_evenements:activite_content_cotisation_preinscrit:>]
            [(#STATUT|=={desinscrit}|oui)<:association_evenements:activite_content_cotisation_desinscrit:>]
            [(#STATUT|=={liste_attente}|oui)<:association_evenements:activite_content_cotisation_liste_attente:>]
        </td>
-->
        <td>#NOMBRE_INSCRITS</td>
        <td>
            [<div class="tooltip"><i class="fa fa-comment" aria-hidden="true"></i><span class="tooltiptext"><p>(#COMMENTAIRE)</p></span></div>]
        </td>        
        <td>
            [<div class="tooltip"><i class="fa-solid fa-users" aria-hidden="true"></i><span class="tooltiptext"><p>(#NOM_PARTICIPANTS)</p></span></div>]
        </td>   
        <td>
            [<div class="tooltip"><i class="fas fa-clipboard-list" aria-hidden="true"></i><span class="tooltiptext"><p>(#JOURNAL)</p></span></div>]
        </td>   
        <td>
            [<div class="tooltip"><i class="fas fa-exclamation-circle"></i><span class="tooltiptext"><p>(#ANNOTATION)</p></span></div>]
        </td>   
        <BOUCLE_transaction(TRANSACTIONS){id_transaction}>
                <INCLURE{fond=prive/inclure/miniature_transaction,id_transaction,id_activite}/>
        </BOUCLE_transaction>
            <td></td>
        <//B_transaction>
    </tr>
</BOUCLE_activites>
