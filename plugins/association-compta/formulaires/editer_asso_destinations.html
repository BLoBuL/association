<div class="formulaire_spip formulaire_asso">
	<h3 class="legend">[(#ENV{title})]</h3>
	[<span class='erreur'>(#ENV*{message_erreur})</span>]
    <form method="post" action="#ENV{action}">
		#ACTION_FORMULAIRE{#ENV{action}}
		<ul>
			#SET{erreurs,#ENV**{erreurs}|table_valeur{intitule}}
			<li class="editer_intitule">
				[<span class="erreur_message">(#GET{erreurs})</span>]
				<label for="intitule"><strong><:association_compta:entete_intitule:></strong></label>
				<input name="intitule" type="text" [value="(#ENV{intitule})"] id="intitule" class="text" required="required" />
			</li>
			<li class="editer_commentaire">
				<label for="commentaire"><strong><:association_compta:commentaires:></strong></label>
				<textarea rows="3" name="commentaire" id="commentaire"  class='formo'/>[(#ENV{commentaire})]</textarea>
			</li>
		</ul>
		<p class="boutons"><input type="submit" value="<:pass_ok:>" class="submit" /></p>
	</form>
</div>
